name: Trigger FIREQ documentation rebuild

on:
  push:
    branches:
      - docs/initial_doc
    paths:
      - "docs/**"

permissions:
  contents: read

jobs:
  trigger-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger FIREQ-docs workflow
        env:
          GH_TOKEN: ${{ secrets.FIREQ_DISPATCH_PAT }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/vlsi-nanocomputing/FIREQ-docs/dispatches \
            -d "{\"event_type\":\"fireq-component-docs-updated\",\"client_payload\":{\"repository\":\"${SOURCE_REPO}\",\"ref\":\"${SOURCE_REF}\",\"sha\":\"${SOURCE_SHA}\"}}"
